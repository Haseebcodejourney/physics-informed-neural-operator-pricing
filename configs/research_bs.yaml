# Phase 1: Black-Scholes only — train until validation rel-L2 < 5% (typical target)
# Good first run before fractional / Merton curriculum

experiment:
  name: cf_hpino_research_bs

model:
  backbone: fno
  hidden_dim: 128
  fno_depth: 4
  fno_modes: 16
  n_spatial: 64
  n_temporal: 32

data:
  model: black_scholes
  n_param_samples: 600
  n_spatial: 64
  n_temporal: 32
  option_style: european

loss:
  pde_type: black_scholes
  adaptive: true
  lambda_physics: 0.12
  lambda_boundary: 0.5

train:
  experiment_name: cf_hpino_research_bs
  device: cuda
  checkpoint_dir: checkpoints/research_bs
  curriculum: [black_scholes]
  epochs_per_stage: 120
  min_epochs: 30
  patience: 25
  batch_size: 8
  lr: 0.001
  val_fraction: 0.15
  test_fraction: 0.10
  save_every: 5
  use_amp: true
  monitor: val_rel_l2
  seed: 42
  run_test_after_train: true
